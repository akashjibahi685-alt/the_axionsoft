  <text x="100" y="240" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="44" fill="#F5F3EF" letter-spacing="-1">SYNAPSE DATAFLOW CORE</text>
  <text x="100" y="280" font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="20" fill="#A5A5A5">Ultra-Low Latency Event Streaming Core</text>

