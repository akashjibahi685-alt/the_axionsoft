  <text x="210" y="370" font-family="monospace" font-size="12" fill="#777">ENGINEERING ARTIFACT // SPEC</text>
  
  <text x="130" y="420" font-family="monospace" font-size="16" fill="#B6FF5C">let stream = Synapse::stream_from_ring_buffer(BufferConfig::zero_copy());</text>
  <text x="130" y="455" font-family="monospace" font-size="15" fill="#D1D5DB">stream.backpressure_strategy(Backpressure::DropOldestAdaptive);</text>
  <text x="130" y="490" font-family="monospace" font-size="15" fill="#9CA3AF">throughput.bench_record({ events_per_sec: 2_450_000, mem_mb: 18.4 });</text>
